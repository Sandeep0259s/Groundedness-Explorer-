name: Publish Docker image

# Builds the image once here (on GitHub's infrastructure) so nobody who
# just wants to run the app has to build it themselves — `docker compose
# up` becomes a pull, not a 5-10 minute local build of torch/chromadb/etc.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A Docker image reference's path component must be lowercase and
      # can't *end* in a separator character. The repo name itself is
      # "Groundedness-Explorer-" — capitals (fixed by tr) AND a trailing
      # hyphen (fixed by the sed strip) — so github.repository can't be
      # used as a tag verbatim; every earlier attempt at this workflow
      # failed on exactly this, independent of the torch/permissions fixes
      # tried along the way, which is why "invalid reference format" a
      # log dump finally exposed was the actual root cause all along.
      - name: Compute lowercase image name
        id: image
        run: |
          name="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+$//')"
          echo "name=${REGISTRY}/${name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
