name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (OCR + video/audio decoding)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # No Ollama in CI — LLM-generation-dependent tests self-skip (see
        # tests/test_api.py's ollama_available fixture); everything else runs.
        run: pytest -v
