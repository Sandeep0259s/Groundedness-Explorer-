[pytest]
testpaths = tests
python_files = test_*.py
# Without this, a bare `pytest` invocation (as opposed to `python -m pytest`,
# which auto-adds the cwd to sys.path) fails every test with
# "ModuleNotFoundError: No module named 'src'" — this is what broke CI from
# the very first commit, since the workflow runs plain `pytest -v`.
pythonpath = .
